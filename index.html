<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>האתר הראשון שלי</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #ff6b6b;
      transition: background-color 0.6s ease;
    }

    .card {
      max-width: 560px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.1;
      margin-bottom: 16px;
      color: #222;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 32px;
    }

    button {
      font: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      color: #fff;
      background: #222;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover  { transform: scale(1.05); }
    button:active { transform: scale(0.97); }

    #color-name {
      display: block;
      margin-top: 18px;
      font-family: monospace;
      font-size: 1rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>האתר הראשון שלי</h1>
    <p>שלום! זה עמוד שנוצר בעזרת Claude Code במסגרת הקורס עיצוב ואלגוריתמים. לחצו על הכפתור כדי להחליף את צבע הרקע.</p>
    <button id="color-button">החלף צבע</button>
    <span id="color-name">#ff6b6b</span>
  </main>

  <script>
    const colors = [
      "#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1",
      "#5f27cd", "#ff9ff3", "#54a0ff", "#ee5253"
    ];
    let current = 0;

    const button = document.getElementById("color-button");
    const label = document.getElementById("color-name");

    button.addEventListener("click", () => {
      // pick a random color that differs from the current one
      let next;
      do {
        next = Math.floor(Math.random() * colors.length);
      } while (next === current);
      current = next;

      document.body.style.backgroundColor = colors[current];
      label.textContent = colors[current];
    });
  </script>
</body>
</html>
